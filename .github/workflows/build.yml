name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        shell: bash
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          INWORLD_KEY: ${{ secrets.INWORLD_KEY }}
          INWORLD_MODEL: ${{ secrets.INWORLD_MODEL }}
          FISH_KEY: ${{ secrets.FISH_KEY }}
          FISH_MODEL: ${{ secrets.FISH_MODEL }}
        run: |
          if [ -z "$OPENROUTER_KEY" ]; then echo "::warning title=Missing secret::OPENROUTER_KEY is not set, so the app will ask for a key."; fi
          echo "::notice title=Voice::Inworld key $([ -n "$INWORLD_KEY" ] && echo set || echo missing), Fish key $([ -n "$FISH_KEY" ] && echo set || echo missing)"
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build errors::$msg"
          fi
          exit $code
      - run: cp app/build/outputs/apk/debug/app-debug.apk Dusk.apk
      - name: Check coach voices
        if: always()
        continue-on-error: true
        shell: bash
        env:
          INWORLD_KEY: ${{ secrets.INWORLD_KEY }}
          INWORLD_MODEL: ${{ secrets.INWORLD_MODEL }}
          FISH_KEY: ${{ secrets.FISH_KEY }}
          FISH_MODEL: ${{ secrets.FISH_MODEL }}
        run: |
          IM="${INWORLD_MODEL:-inworld-tts-2}"; FM="${FISH_MODEL:-s2.1-pro-free}"; out=""
          for v in Kelsey Jonah Priya Dennis; do
            code=$(curl -s -o /tmp/iw.json -w "%{http_code}" -X POST https://api.inworld.ai/tts/v1/voice \
              -H "Authorization: Basic $INWORLD_KEY" -H "Content-Type: application/json" \
              -d "{\"text\":\"Hi.\",\"voiceId\":\"$v\",\"modelId\":\"$IM\"}")
            out="$out Inworld $v=$code"
            if [ "$code" != "200" ]; then out="$out ($(head -c 160 /tmp/iw.json | tr -d '\n\"'))"; fi
            out="$out;"
          done
          for v in Sarah:933563129e564b19a115bedd57b7406a Adrian:bf322df2096a46f18c579d0baa36f41d Nova:b545c585f631496c914815291da4e893; do
            code=$(curl -s -o /tmp/fa.bin -w "%{http_code}" -X POST https://api.fish.audio/v1/tts \
              -H "Authorization: Bearer $FISH_KEY" -H "Content-Type: application/json" -H "model: $FM" \
              -d "{\"text\":\"Hi.\",\"reference_id\":\"${v#*:}\",\"format\":\"mp3\"}")
            out="$out Fish ${v%%:*}=$code"
            if [ "$code" != "200" ]; then out="$out ($(head -c 160 /tmp/fa.bin | tr -d '\n\"'))"; fi
            out="$out;"
          done
          code=$(curl -s -o /tmp/ff.bin -w "%{http_code}" -X POST https://api.fish.audio/v1/tts \
            -H "Authorization: Bearer $FISH_KEY" -H "Content-Type: application/json" -H "model: s2.1-pro-free" \
            -d "{\"text\":\"Hi.\",\"reference_id\":\"933563129e564b19a115bedd57b7406a\",\"format\":\"mp3\"}")
          out="$out Fish free-model Sarah=$code"
          if [ "$code" != "200" ]; then out="$out ($(head -c 160 /tmp/ff.bin | tr -d '\n\"'))"; fi
          echo "::notice title=Voice check::$out"
      - uses: actions/upload-artifact@v4
        with:
          name: Dusk-apk
          path: Dusk.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dusk build ${{ github.run_number }}
          files: Dusk.apk
          make_latest: true
