name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        shell: bash
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          INWORLD_KEY: ${{ secrets.INWORLD_KEY }}
          INWORLD_VOICE: ${{ secrets.INWORLD_VOICE }}
          INWORLD_MODEL: ${{ secrets.INWORLD_MODEL }}
          FISH_KEY: ${{ secrets.FISH_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          FISH_MODEL: ${{ secrets.FISH_MODEL }}
        run: |
          if [ -z "$OPENROUTER_KEY" ]; then echo "::warning title=Missing secret::OPENROUTER_KEY is not set, so the app will ask for a key."; fi
          if [ -n "$INWORLD_KEY" ]; then echo "::notice title=Voice::Using Inworld TTS"; elif [ -n "$FISH_KEY" ]; then echo "::notice title=Voice::Using Fish Audio TTS"; else echo "::notice title=Voice::Using on-device TTS"; fi
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build errors::$msg"
          fi
          exit $code
      - run: cp app/build/outputs/apk/debug/app-debug.apk Dusk.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Dusk-apk
          path: Dusk.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dusk build ${{ github.run_number }}
          files: Dusk.apk
          make_latest: true
